<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SEO Content Checker</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#1a1d23;--muted:#5d6573;--line:#e2e5ea;--accent:#2b59c3;--good:#1f8a4c;--warn:#b7791f;--bad:#c53030;--info:#7a828f;--warnbg:#fdf3e1;--badbg:#fde8e8;--kw:#c9ecd0;--wd:#ffe0b8;--input:#fff;--link:#1a0dab}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121417;--card:#1b1e23;--text:#e7e9ec;--muted:#9aa3b0;--line:#2c3138;--accent:#7aa2ff;--good:#4cc27e;--warn:#e0a84a;--bad:#f07171;--info:#9aa3b0;--warnbg:#33290f;--badbg:#3a1a1a;--kw:#1e4a2a;--wd:#5a3a14;--input:#15171b;--link:#8ab4f8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121417;--card:#1b1e23;--text:#e7e9ec;--muted:#9aa3b0;--line:#2c3138;--accent:#7aa2ff;--good:#4cc27e;--warn:#e0a84a;--bad:#f07171;--info:#9aa3b0;--warnbg:#33290f;--badbg:#3a1a1a;--kw:#1e4a2a;--wd:#5a3a14;--input:#15171b;--link:#8ab4f8;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,"Segoe UI",Roboto,Arial,sans-serif}
header{padding:18px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}header h1{margin:0;font-size:22px}header p{margin:4px 0 0;color:var(--muted);font-size:14px}
.wrap{display:grid;grid-template-columns:minmax(300px,430px) 1fr;gap:16px;padding:12px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
@media(max-width:980px){.wrap{grid-template-columns:1fr}}
@media(max-width:480px){.wrap{grid-template-columns:minmax(0,1fr)}.tab{padding:6px 7px;font-size:13px}.bar{grid-template-columns:90px 1fr 32px}table{display:block;overflow-x:auto}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 4px}label small{font-weight:400;color:var(--muted)}
input,textarea{width:100%;background:var(--input);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:inherit}
textarea{resize:vertical}#content{min-height:320px;font-size:14px}
.cnt{font-size:12px;color:var(--muted);text-align:right;margin-top:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
button.sec{background:transparent;color:var(--accent);border:1px solid var(--line)}
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab{background:none;color:var(--muted);border-radius:6px 6px 0 0;padding:8px 10px;font-size:14px}
.tab.on{color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.tab i{font-style:normal;display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--badbg);color:var(--bad);font-size:11px}
.chk{display:flex;gap:10px;padding:9px 12px;border-radius:8px;margin-bottom:6px;border:1px solid var(--line)}
.chk .dot{flex:0 0 10px;height:10px;border-radius:50%;margin-top:6px}
.good .dot{background:var(--good)}.warn .dot{background:var(--warn)}.bad .dot{background:var(--bad)}.info .dot{background:var(--info)}
.chk.bad{background:var(--badbg)}.chk.warn{background:var(--warnbg)}
.chk .d{color:var(--muted);font-size:13px}
.score{display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.big{font-size:46px;font-weight:800;line-height:1}.big small{font-size:16px;color:var(--muted)}
.bars{flex:1;min-width:230px}
.bar{display:grid;grid-template-columns:110px 1fr 36px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.bar .t{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar .f{height:100%;border-radius:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:12px 0}
.stat{border:1px solid var(--line);border-radius:8px;padding:8px 10px}.stat b{display:block;font-size:19px}.stat span{font-size:12px;color:var(--muted)}
h3{margin:18px 0 8px;font-size:16px}
.serp{border:1px solid var(--line);border-radius:8px;padding:14px;font-family:Arial,sans-serif;max-width:640px}
.serp .u{font-size:13px;color:var(--muted)}.serp .ti{font-size:20px;color:var(--link);margin:4px 0}.serp .de{font-size:14px;color:var(--muted)}
.pill{display:inline-block;padding:2px 10px;border-radius:12px;font-weight:700;font-size:13px;color:#fff;margin-left:6px}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid var(--line);padding:6px;text-align:left}
.hl p{margin:0 0 10px}.hl .hd{font-weight:700;margin:14px 0 6px}
mark.kw{background:var(--kw);color:inherit}mark.wd{background:var(--wd);color:inherit}
.long{text-decoration:underline wavy var(--warn);text-underline-offset:3px}.pass{border-bottom:2px dotted #8b5cf6}
.legend{font-size:12px;margin-bottom:10px}.legend span{margin-right:14px}
.links a{display:block;margin:7px 0;color:var(--accent);word-break:break-word;font-size:14px}
.muted{color:var(--muted);font-size:13px}.empty{color:var(--muted);padding:40px 0;text-align:center}
</style>
</head>
<body>
<header><h1>SEO Content Checker</h1><p>Checks your blog post's meta tags, keywords, readability, structure, duplicate text and grammar before you publish. Free. Your article stays in your browser unless you click "Run full grammar check", which sends it to LanguageTool.</p></header>
<div class="wrap">
<div class="card">
<label>Focus keyword</label><input id="kw" placeholder="e.g. best running shoes">
<label>Secondary keywords <small>(comma separated)</small></label><input id="kw2" placeholder="e.g. running shoes for men, cushioned shoes">
<label>Meta title</label><input id="title" placeholder="50–60 characters"><div class="cnt" id="tc"></div>
<label>Meta description</label><textarea id="desc" rows="3" placeholder="120–160 characters"></textarea><div class="cnt" id="dc"></div>
<label>URL slug <small>(or full URL)</small></label><input id="slug" placeholder="best-running-shoes">
<label>Your domain <small>(to count internal links)</small></label><input id="domain" placeholder="example.com">
<label>Article <small>(paste from Google Docs, Word or WordPress. Headings and links are kept.)</small></label>
<textarea id="content" placeholder="Paste your article here..."></textarea><div class="cnt" id="cc"></div>
<div class="row"><button id="go">Check content</button><button class="sec" id="clear">Clear all</button></div>
</div>
<div class="card"><div class="tabs" id="tabs"></div><div id="out"><div class="empty">Paste your article and click <b>Check content</b>.</div></div></div>
</div>
<script>
"use strict";
const $=id=>document.getElementById(id);
const FIELDS=['kw','kw2','title','desc','slug','domain','content'];
const h=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const rx=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const norm=s=>s.replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/ /g,' ');
const ctx=document.createElement('canvas').getContext('2d');
const px=(t,f)=>{ctx.font=f;return ctx.measureText(t).width};
function fit(t,f,max){if(px(t,f)<=max)return t;let s=t;while(s&&px(s+' ...',f)>max)s=s.slice(0,-1);return s.trim()+' ...'}
const TF='20px Arial',TMAX=580,DF='14px Arial',DMAX=920;

const STOP=new Set('a an the and or but of to in on for with at by from is are was were be been it this that as your you we our i my me how what why can do does will not so if than then them they their its has have had into about more most also just all any some there these those which who when where very'.split(' '));
const POWER=['best','top','ultimate','free','easy','proven','guide','complete','simple','quick','fast','new','essential','expert','step-by-step','how to','tips','ways','review','vs','checklist','mistakes','honest','tested','cheap','beginner','real','exact','why'];
const CTA=['learn','discover','get','try','find','see','check','start','download','compare','read','shop','book','explore','join','save','buy','order','calculate','use'];
/* Wordy phrases with plainer alternatives (shown as suggestions only) */
const WORDY=[['in order to','to'],['due to the fact that','because'],['at this point in time','now'],['for the purpose of','to / for'],['in the event that','if'],['a large number of','many'],['a wide range of','many'],['a variety of','many'],['the majority of','most'],['with regard to','about'],['in spite of the fact that','although'],['it is important to note that','(cut it)'],["it's important to note that",'(cut it)'],['it is worth noting that','(cut it)'],["it's worth noting that",'(cut it)'],['needless to say','(cut it)'],['it goes without saying','(cut it)'],['at the end of the day','(cut it)'],['when it comes to','for / with'],['in today\'s fast-paced world','(cut it)'],['in today\'s digital age','(cut it)'],['utilize','use'],['utilizing','using'],['leverage','use'],['facilitate','help'],['commence','start'],['endeavor','try'],['in close proximity to','near'],['has the ability to','can'],['is able to','can'],['make a decision','decide'],['take into consideration','consider'],['plays a crucial role in','matters for'],['plays a vital role in','matters for'],['delve into','look at'],['dive into','look at'],['a plethora of','many'],['myriad','many'],['seamless','smooth'],['robust','strong'],['cutting-edge','new'],['state-of-the-art','modern'],['game-changer','big change'],['ever-evolving','changing'],['navigate the complexities','handle'],['unlock the potential','get more from'],['elevate','improve'],['very unique','unique'],['completely eliminate','eliminate'],['basically','(cut it)'],['actually','(often cut)'],['really','(often cut)']].sort((a,b)=>b[0].length-a[0].length);
const TYPO={recieve:'receive',seperate:'separate',definately:'definitely',occured:'occurred',untill:'until',accomodate:'accommodate',acheive:'achieve',beleive:'believe',wich:'which',teh:'the',alot:'a lot',existance:'existence',goverment:'government',enviroment:'environment',begining:'beginning',buisness:'business',calender:'calendar',comming:'coming',concious:'conscious',embarassing:'embarrassing',foward:'forward',freind:'friend',grammer:'grammar',independant:'independent',knowlege:'knowledge',neccessary:'necessary',noticable:'noticeable',occassion:'occasion',persue:'pursue',posession:'possession',publically:'publicly',recomend:'recommend',refered:'referred',relevent:'relevant',sucess:'success',succesful:'successful',suprise:'surprise',tommorow:'tomorrow',truely:'truly',wierd:'weird',writting:'writing',adress:'address',arguement:'argument',basicly:'basically',completly:'completely',diffrent:'different',finaly:'finally',garantee:'guarantee',immediatly:'immediately',occurence:'occurrence',thier:'their',dont:"don't",doesnt:"doesn't",cant:"can't",wont:"won't",isnt:"isn't",didnt:"didn't"};
const CONF=[[/\bcould of\b/gi,'could have'],[/\bshould of\b/gi,'should have'],[/\bwould of\b/gi,'would have'],[/\byour welcome\b/gi,"you're welcome"],[/\bthere is many\b/gi,'there are many'],[/\bless people\b/gi,'fewer people'],[/\bmore better\b/gi,'better'],[/\bmost best\b/gi,'best'],[/\bthen ever\b/gi,'than ever'],[/\bmore then\b/gi,'more than'],[/\bbetter then\b/gi,'better than']];
const PASSIVE=/\b(am|is|are|was|were|be|been|being)\s+(\w+ly\s+)?(\w+ed|built|done|made|given|taken|written|seen|known|shown|found|told|sold|paid|held|kept|left|lost|sent|chosen|driven|forgotten|hidden|broken|spoken|bought|brought|caught|taught|thought|understood|drawn|grown)\b/i;

/* ---------- convert pasted HTML to simple markdown ---------- */
function htmlToMd(html){
  const d=new DOMParser().parseFromString(html,'text/html');d.querySelectorAll('script,style,noscript').forEach(e=>e.remove());
  const out=[],img=n=>'!['+(n.getAttribute('alt')||'')+']('+(n.getAttribute('src')||'image')+')';
  const inline=el=>{let s='';el.childNodes.forEach(n=>{if(n.nodeType===3)s+=n.nodeValue;else if(n.nodeType===1){const t=n.tagName;
    if(t==='A'&&n.getAttribute('href'))s+='['+inline(n).trim()+']('+n.getAttribute('href')+')';else if(t==='IMG')s+=img(n);else if(t==='BR')s+=' ';else s+=inline(n)}});return s.replace(/\s+/g,' ')};
  const walk=el=>el.childNodes.forEach(n=>{
    if(n.nodeType===3){if(n.nodeValue.trim())out.push(n.nodeValue.trim());return}
    if(n.nodeType!==1)return;const t=n.tagName;
    if(/^H[1-6]$/.test(t)){const s=inline(n).trim();if(s)out.push('#'.repeat(+t[1])+' '+s)}
    else if(t==='LI'){const s=inline(n).trim();if(s)out.push('- '+s)}
    else if(['P','BLOCKQUOTE','TD','TH','FIGCAPTION','DT','DD'].includes(t)){const s=inline(n).trim();if(s)out.push(s)}
    else if(t==='IMG')out.push(img(n));else walk(n)});
  walk(d.body);return out.join('\n\n');
}
$('content').addEventListener('paste',e=>{
  const html=e.clipboardData&&e.clipboardData.getData('text/html');
  if(html&&/<(h[1-6]|p|li|a)\b/i.test(html)){e.preventDefault();const ta=$('content');ta.setRangeText(htmlToMd(html),ta.selectionStart,ta.selectionEnd,'end');run()}
});

/* ---------- parse article ---------- */
const stripMd=s=>norm(s).replace(/!\[[^\]]*\]\([^)]*\)/g,'').replace(/\[([^\]]*)\]\([^)]*\)/g,'$1').replace(/\*\*|__|`/g,'').replace(/^>\s*/,'').trim();
function parse(raw){
  if(/<\/?(p|h[1-6]|div|a|img|ul|li|br)\b/i.test(raw))raw=htmlToMd(raw);
  raw=norm(raw);const blocks=[],images=[],links=[];let m;
  const ri=/!\[([^\]]*)\]\(([^)\s]*)[^)]*\)/g;while((m=ri.exec(raw)))images.push({alt:m[1].trim(),src:m[2]});
  const rl=/(^|[^!])\[([^\]]*)\]\(([^)\s]+)[^)]*\)/gm;while((m=rl.exec(raw)))links.push({text:m[2],href:m[3]});
  let marked=false;
  raw.split(/\r?\n/).forEach(line=>{const l=line.trim();if(!l)return;let x;
    if((x=l.match(/^(#{1,6})\s+(.+)$/))){marked=true;blocks.push({type:'h',level:x[1].length,text:stripMd(x[2])});return}
    if(/^!\[[^\]]*\]\([^)]*\)$/.test(l))return;
    if((x=l.match(/^([-*+•]|\d+[.)])\s+(.+)$/))){const t=stripMd(x[2]);if(t)blocks.push({type:'p',text:t,list:true});return}
    const t=stripMd(l);if(t)blocks.push({type:'p',text:t})});
  let guessed=false;
  if(!marked)blocks.forEach((b,i)=>{if(b.list||i===blocks.length-1)return;
    if(b.text.split(/\s+/).length<=12&&!/[.!:;,]$/.test(b.text)){b.type='h';b.level=i===0?1:2;guessed=true}});
  return{blocks,paras:blocks.filter(b=>b.type==='p'),heads:blocks.filter(b=>b.type==='h'),images,links,guessed};
}
const words=t=>t.match(/[A-Za-z0-9]+(?:['\-][A-Za-z0-9]+)*/g)||[];
function sentences(p){
  const s=p.replace(/\s+/g,' ').replace(/(\d)\.(\d)/g,'$1⁣$2').replace(/\b(e\.g|i\.e|etc|vs|Mr|Mrs|Dr|St|approx)\./gi,x=>x.replace(/\./g,'⁣'));
  return(s.match(/[^.!?]+(?:[.!?]+["')\]]*|$)/g)||[]).map(x=>x.replace(/⁣/g,'.').trim()).filter(x=>/[A-Za-z0-9]/.test(x));
}
function syl(w){w=w.toLowerCase().replace(/[^a-z]/g,'');if(!w)return 0;if(w.length<=3)return 1;w=w.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/,'').replace(/^y/,'');const m=w.match(/[aeiouy]{1,2}/g);return m?m.length:1}
function count(text,ph){if(!ph)return 0;return(text.match(new RegExp('\\b'+rx(ph).replace(/\s+/g,'\\s+')+'\\b','gi'))||[]).length}

/* ---------- analysis ---------- */
const CATS={meta:'Meta & URL',kw:'Keywords',read:'Readability',struct:'Structure',orig:'Originality',gram:'Grammar'};
const WEIGHT={meta:20,kw:20,read:15,struct:20,orig:10,gram:15};
let R=null,TAB='overview';

function analyze(v){
  const kw=norm(v.kw.trim().toLowerCase()),kw2=v.kw2.split(',').map(s=>norm(s.trim().toLowerCase())).filter(Boolean);
  const title=norm(v.title.trim()),desc=norm(v.desc.trim()),tl=title.toLowerCase(),dl=desc.toLowerCase();
  let slug=v.slug.trim().replace(/[?#].*$/,'');if(slug.includes('/'))slug=slug.replace(/\/+$/,'').split('/').pop()||'';
  const domain=v.domain.trim().toLowerCase().replace(/^https?:\/\//,'').replace(/^www\./,'').replace(/\/.*$/,'');
  const P=parse(v.content);
  const body=P.paras.map(p=>p.text).join('\n'),all=P.heads.map(x=>x.text).join('\n')+'\n'+body;
  const W=words(all),BW=words(body),N=W.length,bw=BW.length||1;
  const S=[];P.paras.forEach((p,pi)=>sentences(p.text).forEach(t=>S.push({t,w:words(t).length,pi})));const sc=S.length||1;
  const C=[];const add=(cat,st,t,d)=>C.push({cat,st,t,d:d||''});

  /* META */
  let tS=0,dS=0;
  if(!title)add('meta','bad','Meta title is missing','Write a 50–60 character title with your keyword near the start.');
  else{
    const w=px(title,TF);
    if(w>TMAX)add('meta','warn','Title will be cut off in Google',`${title.length} characters, ${Math.round(w)}px. Google shows about ${TMAX}px. Cut it to about 55–60 characters.`);
    else if(title.length<30){add('meta','warn','Title is too short',`${title.length} characters. Use 50–60 to fill the space.`);tS+=10}
    else{add('meta','good','Title length is good',`${title.length} characters, ${Math.round(w)}px`);tS+=25}
    if(kw){const i=tl.indexOf(kw);
      if(i<0)add('meta','bad','Keyword is not in the title','Use the exact focus keyword, ideally at the start.');
      else if(i<=title.length*0.4){add('meta','good','Keyword is near the start of the title');tS+=35}
      else{add('meta','warn','Keyword is late in the title','Move it toward the front.');tS+=22}}
    if(/\d/.test(title)){tS+=10;add('meta','good','Title has a number or year')}else add('meta','info','No number in the title','A number or year ("7 Ways", "2026") often gets more clicks.');
    const pw=POWER.filter(p=>new RegExp('\\b'+rx(p)+'\\b','i').test(title));
    if(pw.length){tS+=15;add('meta','good','Title has a benefit word',pw.join(', '))}else add('meta','warn','Title has no benefit word','Add one, e.g. best, easy, complete, tested, free.');
    const caps=(title.match(/\b[A-Z]{4,}\b/g)||[]).filter(x=>!/^(HTML|FAQ|JSON|HTTP|HTTPS|NASA|USA|UAE)$/.test(x));
    if(caps.length>1)add('meta','warn','Too many ALL-CAPS words',caps.join(', '));else tS+=5;
    const tw=words(tl).filter(x=>!STOP.has(x)),dup=[...new Set(tw.filter((x,i)=>tw.indexOf(x)!==i))];
    if(dup.length)add('meta','warn','Repeated words in title',dup.join(', ')+'. This can look like keyword stuffing.');else tS+=10;
  }
  if(!desc)add('meta','bad','Meta description is missing','Write 120–160 characters with the keyword and a reason to click.');
  else{
    const w=px(desc,DF);
    if(desc.length<70)add('meta','bad','Description is too short',`${desc.length} characters. Google will probably write its own.`);
    else if(desc.length<120){add('meta','warn','Description is a bit short',`${desc.length} characters. Aim for 120–160.`);dS+=15}
    else if(w>DMAX){add('meta','warn','Description will be cut off',`${desc.length} characters, ${Math.round(w)}px. Keep it under about 155 characters.`);dS+=15}
    else{add('meta','good','Description length is good',`${desc.length} characters`);dS+=30}
    if(kw){if(dl.includes(kw)){dS+=30;add('meta','good','Keyword is in the description','Google bolds it in results.')}else add('meta','bad','Keyword is not in the description')}
    const ct=CTA.filter(c=>new RegExp('\\b'+c+'\\b','i').test(desc));
    if(ct.length){dS+=20;add('meta','good','Description has a call to action',ct.join(', '))}else add('meta','warn','No call to action','Start or end with a verb: Learn, Compare, Find, Get, Try.');
    if(/\d/.test(desc))dS+=10;
    if(desc.includes('"'))add('meta','warn','Double quotes in description','Google can cut the text at a double quote. Use single quotes.');else dS+=5;
    if(title&&dl===tl)add('meta','bad','Description is the same as the title');else dS+=5;
  }
  if(slug){
    const s=slug.toLowerCase(),sw=s.split('-').filter(Boolean);
    if(slug!==s||/[^a-z0-9\-]/.test(s))add('meta','warn','Slug format','Use lowercase words joined by hyphens, with no spaces, underscores or symbols.');else add('meta','good','Slug format is clean');
    if(sw.length>6||s.length>60)add('meta','warn','Slug is long',`${sw.length} words. 3–5 words is ideal.`);
    const st=sw.filter(x=>STOP.has(x));if(st.length)add('meta','warn','Stop words in slug','Remove: '+st.join(', '));
    if(/(^|-)(19|20)\d\d(-|$)/.test(s))add('meta','warn','Year in slug','A year in the URL dates the page. Put the year in the title instead.');
    if(kw){const k=words(kw).filter(x=>!STOP.has(x)),miss=k.filter(x=>!sw.includes(x));if(!miss.length)add('meta','good','Keyword is in the slug');else add('meta','bad','Keyword is not fully in the slug','Missing: '+miss.join(', '))}
  }else add('meta','info','No slug entered','Add the slug to check it.');

  /* KEYWORDS */
  const kc=kw?count(all,kw):0,kn=kw?words(kw).length:1,dens=N?kc*kn/N*100:0,lo=Math.max(1,Math.round(N*0.005)),hi=Math.max(2,Math.round(N*0.02));
  if(!kw)add('kw','bad','No focus keyword entered','Enter the main search term you want this post to rank for.');
  else{
    if(dens>3)add('kw','bad','Keyword stuffing',`"${h(kw)}" is used ${kc} times (${dens.toFixed(2)}%). Google can treat this as spam. Cut it to ${lo}–${hi} uses and use synonyms instead.`);
    else if(dens>2.5)add('kw','warn','Keyword density is high',`${kc} uses (${dens.toFixed(2)}%). Aim for ${lo}–${hi}.`);
    else if(!kc)add('kw','bad','Keyword is not in the article');

    if(!c)add('kw','warn',`Secondary keyword missing: "${h(k)}"`);else if(d>2)add('kw','warn',`Secondary keyword overused: "${h(k)}"`,`${c} times (${d.toFixed(1)}%)`);else add('kw','good',`Secondary keyword used: "${h(k)}"`,`${c} times`)});

  if(flesch>=60)add('read','good','Easy to read',`Flesch score ${flesch.toFixed(0)}, about grade ${grade.toFixed(1)}`);

  const longS=S.filter(s=>s.w>25),lp=longS.length/sc*100;
  if(lp<=20)add('read','good','Few long sentences',`${longS.length} over 25 words (${lp.toFixed(0)}%)`);else add('read','warn','Too many long sentences',`${longS.length} over 25 words (${lp.toFixed(0)}%). Keep this under 20%. See Highlights.`);
  const pas=S.filter(s=>PASSIVE.test(s.t)),pp=pas.length/sc*100;
  if(pp<=10)add('read','good','Little passive voice',pp.toFixed(0)+'%');else add('read',pp<=15?'warn':'bad','Too much passive voice',`${pas.length} sentences (${pp.toFixed(0)}%). Keep it under 10%. "We tested it" reads better than "It was tested".`);
  const lpar=P.paras.filter(p=>words(p.text).length>120);if(lpar.length)add('read','warn','Long paragraphs',`${lpar.length} paragraphs over 120 words. Split into 2–4 sentences for mobile.`);else add('read','good','Paragraph length is good');
  let same=0;const fw=i=>(words(S[i].t)[0]||'').toLowerCase();for(let i=2;i<S.length;i++)if(fw(i)&&fw(i)===fw(i-1)&&fw(i)===fw(i-2))same++;
  if(same)add('read','warn','Repetitive sentence openings',`${same} times, three sentences in a row start with the same word.`);
  const wd=[];WORDY.forEach(([p,r])=>{const c=count(body,p);if(c)wd.push({p,r,c})});
  if(wd.length)add('read',wd.length>5?'bad':'warn','Wordy or filler phrases',wd.map(o=>`<b>${h(o.p)}</b> → ${h(o.r)} (×${o.c})`).join('<br>'));else add('read','good','No filler phrases found');
  const lens=S.map(s=>s.w),mean=lens.reduce((a,b)=>a+b,0)/(lens.length||1),sd=Math.sqrt(lens.reduce((a,b)=>a+(b-mean)**2,0)/(lens.length||1)),vary=mean?sd/mean:0;
  if(S.length>=8){if(vary>=0.45)add('read','good','Good sentence rhythm','Sentence lengths are nicely varied.');else add('read','warn','Flat sentence rhythm',`Most sentences are a similar length (variety ${vary.toFixed(2)}). Mix short sentences with longer ones so it reads naturally.`)}

  /* STRUCTURE */
  if(N<300)add('struct','bad','Thin content',`${N} words. Posts under 300 words rarely rank.`);

  else if(subs.length&&N/(subs.length+1)>350)add('struct','warn','Sections are too long',`About ${Math.round(N/(subs.length+1))} words per heading. Add a subheading every 200–300 words.`);
  else if(subs.length)add('struct','good','Good number of subheadings',subs.length+' subheadings');
  const skip=[];for(let i=1;i<P.heads.length;i++)if(P.heads[i].level>P.heads[i-1].level+1)skip.push(`H${P.heads[i-1].level} → H${P.heads[i].level}: "${h(P.heads[i].text.slice(0,50))}"`);

  const ht=P.heads.map(x=>x.text.toLowerCase()),hd=[...new Set(ht.filter((x,i)=>ht.indexOf(x)!==i))];if(hd.length)add('struct','warn','Duplicate headings',hd.map(h).join(', '));
  if(N>600&&!P.paras.some(p=>p.list))add('struct','warn','No lists','Bulleted or numbered lists help readers skim and can win featured snippets.');
  const qh=P.heads.filter(x=>/\?$/.test(x.text)||/^(what|how|why|when|which|who|can|is|are|does|do|should)\b/i.test(x.text));
  if(qh.length)add('struct','good','Question headings / FAQ',qh.length+' found. Good for "People also ask".');else add('struct','warn','No question headings or FAQ','Add an FAQ section using questions from Google\'s "People also ask" box.');
  const isInt=l=>/^(\/|#|\.)/.test(l.href)||!/^[a-z]+:/i.test(l.href)||(domain&&l.href.toLowerCase().replace(/^https?:\/\/(www\.)?/,'').startsWith(domain));
  const intL=P.links.filter(isInt),extL=P.links.filter(l=>!isInt(l)&&/^https?:/i.test(l.href));
  if(!intL.length)add('struct','warn','No internal links','Link to 2–5 related posts on your site.'+(domain?'':' Enter your domain so they can be detected.'));else add('struct','good','Internal links',intL.length+' found');
  if(!extL.length)add('struct','warn','No external links','Cite 1–3 trusted sources such as studies or official sites.');else add('struct','good','External links',extL.length+' found');
  const weak=P.links.filter(l=>/^(click here|here|read more|this|link|this link)$/i.test(l.text.trim()));if(weak.length)add('struct','warn','Weak link text',`${weak.length} links say "click here" or similar. Use descriptive words.`);
  if(P.images.length){const na=P.images.filter(i=>!i.alt);if(na.length)add('struct','bad','Images missing alt text',`${na.length} of ${P.images.length}`);else add('struct','good','All images have alt text',P.images.length+' images')}
  else if(N>500)add('struct','warn','No images found','Add images, screenshots or charts. Ignore this if you add them in WordPress.');
  const exp=(body.match(/\b(I|we) (tested|tried|used|found|noticed|bought|reviewed|compared|measured|spent|visited|asked)\b|\bin my experience\b|\bour (team|test|tests|testing)\b|\bI've\b|\bwe've\b|\bhands-on\b/gi)||[]).length;
  if(exp>=2)add('struct','good','Shows first-hand experience (E-E-A-T)',exp+' signals found');else add('struct','warn','Little first-hand experience (E-E-A-T)','Add what you tested, saw or learned yourself, with photos, results or examples.');

/* ---------- render ---------- */
const col=s=>s>=80?'var(--good)':s>=55?'var(--warn)':'var(--bad)';

    const mark=s=>re?s.replace(re,m=>`<mark class="${terms.includes(m.toLowerCase().replace(/\s+/g,' '))?'kw':'wd'}">${m}</mark>`):s;
    o.innerHTML=`<div class="legend"><span><mark class="kw">keyword</mark></span><span><mark class="wd">wordy phrase</mark></span><span class="long">long sentence</span><span class="pass">passive voice</span></div><div class="hl">${R.P.blocks.map(b=>b.type==='h'?`<div class="hd">H${b.level}: ${mark(h(b.text))}</div>`:`<p>${b.list?'• ':''}${sentences(b.text).map(s=>{const c=[words(s).length>25?'long':'',PASSIVE.test(s)?'pass':''].filter(Boolean).join(' ');const t=mark(h(s));return c?`<span class="${c}">${t}</span>`:t}).join(' ')}</p>`).join('')}</div>`;
  }else o.innerHTML=list(TAB);
}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b){TAB=b.dataset.t;render()}});
let LT=null,lastContent='';
async function runLT(){
  if(!R||(LT&&LT.state==='loading'))return;LT={state:'loading'};render();
  const parts=R.P.blocks.map(b=>b.text),chunks=[];let cur='';
  parts.forEach(p=>{if(cur&&(cur.length+p.length)>15000){chunks.push(cur);cur=''}cur+=(cur?'\n\n':'')+p});if(cur)chunks.push(cur);
  const matches=[];
  try{
    for(let i=0;i<chunks.length;i++){
      if(i)await new Promise(r=>setTimeout(r,3500));
      const r=await fetch('https://api.languagetool.org/v2/check',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({text:chunks[i],language:'en-US'})});
      if(!r.ok)throw new Error(r.status===429?'The free limit was reached. Wait one minute and try again.':'LanguageTool returned error '+r.status+'. Try again shortly.');
      matches.push(...(await r.json()).matches);
    }
    LT={state:'done',matches};
  }catch(e){LT={state:'error',msg:/fetch|network|load/i.test(e.message||'')?'This page could not connect to LanguageTool. Copy your article and paste it at languagetool.org instead (free).':e.message}}
  render();
}
$('out').addEventListener('click',e=>{if(e.target.id==='ltbtn')runLT()});

function run(){
  const v={};FIELDS.forEach(f=>v[f]=$(f).value);
  try{localStorage.setItem('seo-checker',JSON.stringify(v))}catch(e){}
  $('tc').textContent=v.title.length+' chars · '+Math.round(px(v.title,TF))+' / '+TMAX+' px';
  $('dc').textContent=v.desc.length+' chars · '+Math.round(px(v.desc,DF))+' / '+DMAX+' px';
  $('cc').textContent=words(v.content).length+' words';
  if(v.content!==lastContent){LT=null;lastContent=v.content}
  R=v.content.trim()?analyze(v):null;render();
}
let tmr;FIELDS.forEach(f=>$(f).addEventListener('input',()=>{clearTimeout(tmr);tmr=setTimeout(run,600)}));
$('go').onclick=run;
let clearArm=0;$('clear').onclick=()=>{const b=$('clear');if(Date.now()-clearArm<4000){FIELDS.forEach(f=>$(f).value='');clearArm=0;b.textContent='Clear all';run()}else{clearArm=Date.now();b.textContent='Click again to clear';setTimeout(()=>{if(Date.now()-clearArm>=3900)b.textContent='Clear all'},4000)}};
try{const s=JSON.parse(localStorage.getItem('seo-checker')||'null');if(s)FIELDS.forEach(f=>{if(s[f])$(f).value=s[f]})}catch(e){}
run();
</script>
